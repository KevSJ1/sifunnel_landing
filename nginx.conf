server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # Astro genera /ruta/index.html (format: directory)
  location / {
    try_files $uri $uri/ =404;
  }
  error_page 404 /404.html;

  # Archivos con hash: caché larga
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ~* \.(png|jpe?g|svg|ico|woff2)$ {
    add_header Cache-Control "public, max-age=604800";
  }
  location ~* \.(html|txt|xml|webmanifest)$ {
    add_header Cache-Control "no-cache";
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
}
